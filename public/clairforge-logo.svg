<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="Clairforge">
  <title>Clairforge</title>
  <!-- Anvil mark (no letterforms) -->
  <g transform="translate(14,18)">
    <rect width="88" height="88" rx="20" fill="#141414"/>
    <!-- Anvil body -->
    <path d="M18 38
             H34 L28 28 H22 L18 38 Z
             M20 38 H70
             L78 44 V52
             C78 58 72 64 64 64
             H32
             C24 64 18 58 18 52
             V44 L20 38 Z
             M28 64 H60
             V70 C60 74 56 78 50 78
             H38 C32 78 28 74 28 70 Z"
          fill="#0d6b45"
          stroke="#c9a227"
          stroke-width="2"
          stroke-linejoin="round"/>
    <!-- Face / step detail lines -->
    <path d="M34 38 H66 L70 44 H22 L26 38 Z" fill="#0a5537" opacity="0.55"/>
    <path d="M32 70 H56" stroke="#c9a227" stroke-width="1.2" opacity="0.7"/>
    <!-- Celtic knot on horn -->
    <g transform="translate(58,46)" stroke="#c9a227" stroke-width="1.1" fill="none">
      <circle r="5.5"/>
      <path d="M-3.5 0 H3.5 M0 -3.5 V3.5"/>
      <circle r="2.2"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="120" y="68"
        font-family="DM Sans, system-ui, sans-serif"
        font-size="40"
        font-weight="700"
        letter-spacing="0.06em"
        fill="#e8eef7">CLAIRFORGE</text>
  <text x="122" y="92"
        font-family="DM Sans, system-ui, sans-serif"
        font-size="11"
        font-weight="500"
        letter-spacing="0.3em"
        fill="#94a3b8">CRAFT · CODE · CLEAR WORK</text>
</svg>
